[project]
name = "chanripper"
version = "0.1.0"
description = "4chan thread downloader and monitor with a GUI"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
chanripper = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "gui"]

[tool.pyinstaller]
# see chanripper.spec for the frozen build configuration
